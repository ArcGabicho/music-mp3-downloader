name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta a publicar (ej. v1.2.3)"
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: MusicMp3Downloader.slnx
  PROJECT: core/MusicMp3Downloader.App.csproj
  CONFIGURATION: Release

jobs:
  package:
    name: Package (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            tfm: net10.0-windows10.0.19041.0
          - rid: maccatalyst
            runner: macos-latest
            tfm: net10.0-maccatalyst

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET MAUI workload
        run: dotnet workload restore ${{ env.SOLUTION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.version || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "number=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Publish (Windows)
        if: matrix.rid == 'win-x64'
        # Sin --runtime explícito: en un proyecto multi-target, pasarlo como propiedad
        # global de MSBuild hace que NuGet lo intente resolver también para el TFM de
        # Mac Catalyst (combinación sin sentido maccatalyst+win-x64), buscando un
        # paquete de runtime Mono para Windows que no existe (NU1102). El RID win-x64
        # se resuelve solo, de forma implícita, para el TFM de Windows en un runner
        # Windows.
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --framework ${{ matrix.tfm }}
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ steps.version.outputs.number }}
          --output ./artifacts/${{ matrix.rid }}

      - name: Publish (Mac Catalyst)
        if: matrix.rid == 'maccatalyst'
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --framework ${{ matrix.tfm }}
          -p:Version=${{ steps.version.outputs.number }}
          --output ./artifacts/${{ matrix.rid }}

      - name: Archive (macOS .app)
        if: runner.os == 'macOS'
        run: |
          app_path=$(find ./artifacts/${{ matrix.rid }} -maxdepth 1 -name "*.app" | head -n1)
          if [ -z "$app_path" ]; then
            echo "No se encontró ningún .app en ./artifacts/${{ matrix.rid }}" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "MusicMp3Downloader-${{ steps.version.outputs.number }}-${{ matrix.rid }}.zip"

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          Compress-Archive -Path ./artifacts/${{ matrix.rid }}/*
          -DestinationPath "MusicMp3Downloader-${{ steps.version.outputs.number }}-${{ matrix.rid }}.zip"

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc `
            /DMyAppVersion=${{ steps.version.outputs.number }} `
            /DSourceDir=${{ github.workspace }}\artifacts\${{ matrix.rid }} `
            /DOutputDir=${{ github.workspace }} `
            packaging\windows\installer.iss
          Copy-Item `
            "MusicMp3Downloader-Setup-${{ steps.version.outputs.number }}-x64.exe" `
            "MusicMp3Downloader-Setup-x64.exe"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: MusicMp3Downloader-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: package-*
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              $prerelease
          fi
