name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta a publicar (ej. v1.2.3)"
        required: true

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: MusicMp3Downloader.slnx
  PROJECT: core/MusicMp3Downloader.App.csproj
  CONFIGURATION: Release

jobs:
  package:
    name: Package (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET MAUI workload
        run: dotnet workload restore ${{ env.SOLUTION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          ref="${{ github.event.inputs.version || github.ref_name }}"
          echo "tag=${ref}" >> "$GITHUB_OUTPUT"
          echo "number=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        # Sin --runtime explícito: en un proyecto multi-target, pasarlo como propiedad
        # global de MSBuild hace que NuGet lo intente resolver también para el TFM de
        # Mac Catalyst (combinación sin sentido maccatalyst+win-x64), buscando un
        # paquete de runtime Mono para Windows que no existe (NU1102). El RID win-x64
        # se resuelve solo, de forma implícita, para el TFM de Windows en un runner
        # Windows.
        run: >
          dotnet publish ${{ env.PROJECT }}
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0-windows10.0.19041.0
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -p:Version=${{ steps.version.outputs.number }}
          --output ./artifacts/win-x64

      - name: Archive (zip)
        shell: pwsh
        run: >
          Compress-Archive -Path ./artifacts/win-x64/*
          -DestinationPath "MusicMp3Downloader-${{ steps.version.outputs.number }}-win-x64.zip"

      - name: Build Windows installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc `
            /DMyAppVersion=${{ steps.version.outputs.number }} `
            /DSourceDir=${{ github.workspace }}\artifacts\win-x64 `
            /DOutputDir=${{ github.workspace }} `
            packaging\windows\installer.iss
          Copy-Item `
            "MusicMp3Downloader-Setup-${{ steps.version.outputs.number }}-x64.exe" `
            "MusicMp3Downloader-Setup-x64.exe"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-win-x64
          path: MusicMp3Downloader-*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: windows-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          pattern: package-*
          merge-multiple: true

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              $prerelease
          fi
