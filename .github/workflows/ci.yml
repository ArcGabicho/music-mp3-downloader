name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION: MusicMp3Downloader.slnx
  CONFIGURATION: Release

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore .NET MAUI workload
        run: dotnet workload restore ${{ env.SOLUTION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          if-no-files-found: ignore

  format:
    name: Verify formatting
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET MAUI workload
        run: dotnet workload restore ${{ env.SOLUTION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Check code style
        run: dotnet format ${{ env.SOLUTION }} --verify-no-changes --no-restore

  publish:
    name: Publish (win-x64)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore .NET MAUI workload
        run: dotnet workload restore ${{ env.SOLUTION }}

      - name: Publish
        # Sin --runtime explícito: el RID win-x64 se resuelve solo, de forma
        # implícita, para el TFM de Windows en un runner Windows.
        run: >
          dotnet publish src/MusicMp3Downloader.App.csproj
          --configuration ${{ env.CONFIGURATION }}
          --framework net10.0-windows10.0.19041.0
          --self-contained true
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          --output ./publish/win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicMp3Downloader-win-x64
          path: ./publish/win-x64
